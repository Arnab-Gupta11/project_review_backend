openapi: 3.0.0
info:
  title: Project Review API
  version: 1.0.0
  description: Project Review System Backend API with PostgreSQL & Prisma 7
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email
        role:
          type: string
          enum: [STUDENT, MENTOR, ADMIN]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectSubmission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectName:
          type: string
        repoUrl:
          type: string
        liveUrl:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        feedback:
          type: string
          nullable: true
        studentId:
          type: string
        student:
          $ref: '#/components/schemas/User'
        reviewerId:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  /health:
    get:
      summary: Liveness check
      responses:
        200:
          description: OK

  /health/ready:
    get:
      summary: Readiness check (checks database connectivity)
      responses:
        200:
          description: Database is connected
        503:
          description: Database is disconnected

  /api/v1/auth/register:
    post:
      summary: Register as student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: User registered successfully

  /api/v1/auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Logged in successfully

  /api/v1/auth/logout:
    post:
      summary: Logout user
      responses:
        200:
          description: User logged out successfully

  /api/v1/auth/me:
    get:
      summary: Get logged-in user profile
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        200:
          description: User profile retrieved

  /api/v1/auth/change-password:
    patch:
      summary: Change password
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        200:
          description: Password changed successfully

  /api/v1/auth/forget-password:
    post:
      summary: Request password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        200:
          description: Reset OTP generated

  /api/v1/auth/reset-password:
    post:
      summary: Reset password with OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email:
                  type: string
                otp:
                  type: string
                newPassword:
                  type: string
      responses:
        200:
          description: Password reset successfully

  /api/v1/submissions:
    post:
      summary: Submit a project (Student only, unique project name per student)
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectName, repoUrl, liveUrl, description]
              properties:
                projectName:
                  type: string
                repoUrl:
                  type: string
                liveUrl:
                  type: string
                description:
                  type: string
      responses:
        201:
          description: Project submitted successfully
        409:
          description: Duplicate project name for this student

    get:
      summary: List all submissions with filter, search, pagination, and stats (Mentor/Admin only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, PENDING, APPROVED, REJECTED]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        200:
          description: Submissions list with stats

  /api/v1/submissions/my-submissions:
    get:
      summary: Get current student's submissions and stats (Student only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, PENDING, APPROVED, REJECTED]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        200:
          description: Student submissions list with stats

  /api/v1/submissions/{id}:
    get:
      summary: Get submission details by ID
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Submission details

  /api/v1/submissions/{id}/review:
    patch:
      summary: Review submission (Mentor/Admin only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                feedback:
                  type: string
      responses:
        200:
          description: Submission reviewed
